<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tạo link thiệp từ Excel · Kate &amp; Arni</title>
  <!-- Thư viện đọc file Excel trực tiếp trên trình duyệt -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #fbf6ee;
      color: #563d2d;
      display: flex;
      justify-content: center;
      padding: 20px 14px;
    }
    .box {
      width: 100%;
      max-width: 520px;
      background: #fffdf9;
      padding: 22px;
      border-radius: 18px;
      border: 1.5px solid #c59b5f;
      box-shadow: 0 10px 25px rgba(86, 61, 45, 0.1);
    }
    h2 { margin-top: 0; font-size: 20px; text-align: center; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
    input[type="text"], input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #c59b5f;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
    }
    .hint { font-size: 12px; color: #7d6250; margin-top: 4px; }
    .list { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #f4eadb;
      border-radius: 12px;
      border: 1px solid rgba(197, 155, 95, 0.4);
    }
    .item-info { overflow: hidden; }
    .item-name { font-weight: 700; font-size: 15px; }
    .item-link { font-size: 11.5px; color: #7d6250; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-copy {
      flex-shrink: 0;
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      background: #c59b5f;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-copy.copied { background: #3b7a57; }
    .btn-all {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #563d2d;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>📊 Nhập Danh Sách Khách Từ Excel</h2>

    <label>1. Link gốc thiệp cưới của bạn:</label>
    <input type="text" id="base-url" value="https://thiep-cuoi-kate-arni.vercel.app">

    <label>2. Chọn file Excel (.xlsx, .xls, .csv):</label>
    <input type="file" id="excel-file" accept=".xlsx, .xls, .csv">
    <p class="hint">* Đặt tên khách mời ở Cột A (dòng đầu tiên có thể là tiêu đề "Tên khách" hoặc tên luôn đều được).</p>

    <button type="button" class="btn-all" id="export-btn" style="display:none;" onclick="downloadResultExcel()">
      ⬇ Tải về file Excel mới kèm sẵn cột Link &amp; Lời mời
    </button>

    <div class="list" id="guest-list"></div>
  </div>

  <script>
    const baseInput = document.getElementById('base-url');
    const fileInput = document.getElementById('excel-file');
    const listEl = document.getElementById('guest-list');
    const exportBtn = document.getElementById('export-btn');
    let parsedGuests = [];

    if (window.location.origin.startsWith('http')) {
      baseInput.value = window.location.origin;
    }

    function buildMessage(name, link) {
      return `Trân trọng kính mời ${name} đến chung vui tại tiệc cưới của Kate & Arni vào lúc 16:30, Thứ Bảy ngày 17.07.2027 tại Nhà Hàng Bốn Mùa (Bon Mua Park – 38 Trần Phú, Nha Trang).

Herzliche Einladung an ${name} zu unserer Hochzeit am Samstag, den 17.07.2027 um 16:30 Uhr im Bon Mua Park (38 Trần Phú, Nha Trang).

Xem thiệp mời điện tử / Digitale Einladung:
${link}`;
    }

    function renderList() {
      const base = baseInput.value.replace(/\/$/, '');
      listEl.innerHTML = '';
      if (parsedGuests.length === 0) {
        exportBtn.style.display = 'none';
        return;
      }
      exportBtn.style.display = 'block';

      parsedGuests.forEach((name, idx) => {
        const link = `${base}/?to=${encodeURIComponent(name)}`;
        const fullMsg = buildMessage(name, link);

        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `
          <div class="item-info">
            <div class="item-name">${idx + 1}. ${name}</div>
            <div class="item-link">${link}</div>
          </div>
          <button type="button" class="btn-copy">Copy lời mời</button>
        `;

        const btn = row.querySelector('button');
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(fullMsg);
          btn.textContent = '✓ Đã copy';
          btn.classList.add('copied');
        });

        listEl.appendChild(row);
      });
    }

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = evt => {
        const wb = XLSX.read(evt.target.result, { type: 'binary' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        // Lọc lấy các ô không rỗng ở Cột A, bỏ qua dòng tiêu đề nếu có
        const headers = ['tên', 'tên khách', 'tên khách mời', 'name', 'guest', 'stt'];
        parsedGuests = rows
          .map(r => (r[0] !== undefined ? String(r[0]).trim() : ''))
          .filter((val, index) => val !== '' && !(index === 0 && headers.includes(val.toLowerCase())));

        renderList();
      };
      reader.readAsBinaryString(file);
    });

    baseInput.addEventListener('input', renderList);

    // Xuất ngược lại file Excel có sẵn cột Link và Lời mời
    function downloadResultExcel() {
      const base = baseInput.value.replace(/\/$/, '');
      const data = parsedGuests.map((name, i) => {
        const link = `${base}/?to=${encodeURIComponent(name)}`;
        return {
          'STT': i + 1,
          'Tên khách mời': name,
          'Link thiệp riêng': link,
          'Tin nhắn mời song ngữ': buildMessage(name, link)
        };
      });
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'DanhSachThiep');
      XLSX.writeFile(wb, 'Link_Thiep_Cuoi_Kate_Arni.xlsx');
    }
  </script>
</body>
</html>
